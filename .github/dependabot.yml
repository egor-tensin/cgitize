version: 2
updates:
  - package-ecosystem: docker
    directories:
      - '**/*'
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directories:
      - '**/*'
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gitsubmodule
    directories:
      - '**/*'
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: cron
      # Slightly later than the scheduled maintenance job (keep those in sync!).
      # The idea is that hopefully, it'll minimize the number of PRs I get for
      # minor dependencies in requirements.txt.
      cronjob: '30 04 * * 5'
