[build-system]
# The SPDX license identifiers are available from 77.0.3:
# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/#license-and-license-files
requires = ["setuptools >= 77.0.3", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "cgitize"
description = "Self-host your repositories using cgit"
license = "MIT"
license-files = ["LICENSE.txt"]
dynamic = ["version"]
authors = [{name = "Egor Tensin", email = "egor@tensin.name"}]
readme = "README.md"
requires-python = ">=3.11"
# ^^^ For enum.StrEnum/contextlib.chdir, at least?

dependencies = [
    "atlassian-python-api >= 4,< 6",
    "PyGithub >= 2,< 3",
    "python-gitlab >= 6,< 9",
    "tomli >= 1,< 3",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
"Homepage" = "https://github.com/egor-tensin/cgitize"
"Bug Tracker" = "https://github.com/egor-tensin/cgitize/issues"

[project.scripts]
cgitize = "cgitize.main:main"

[tool.setuptools]
packages = ["cgitize"]

[tool.setuptools_scm]

[tool.pylint.main]
# Enable Pylint to be run in the venv:
init-hook = """
try: import pylint_venv
except ImportError: pass
else: pylint_venv.inithook()
"""

[tool.pylint."messages control"]
disable = [
    "missing-docstring",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-positional-arguments",
]
