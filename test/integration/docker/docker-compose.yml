services:
  git_server:
    build:
      context: .
      dockerfile: git_server/Dockerfile
    volumes:
      - ssh:/ssh
  cgitize:
    build:
      context: ../../..
      dockerfile: docker/Dockerfile
    depends_on:
      - git_server
    environment:
      SCHEDULE: once
    volumes:
      - ./etc:/etc/cgitize:ro
      - ./output:/mnt/cgitize
      - ssh:/ssh:ro
  frontend:
    build:
      context: ../../../docker/frontend
    ports:
      - '127.0.0.1:80:80'
    volumes:
      - ./output:/mnt/cgitize:ro

volumes:
  ssh:
